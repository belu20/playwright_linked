services:
  linkedin-search:
    image: "linkedin-search-antam"
    build: .
    container_name: linkedin-search-antam
    restart: on-failure:5
    init: true
    shm_size: "256mb"     # tmpfs limit aman untuk Chrome tanpa crash (hanya terpakai sesuai kebutuhan)
    mem_limit: 850m       # budget 4×850MB = 3.4GB, aman di 4GB RAM
    cpus: 0.5
    ports:
      - "1567:1567"
    env_file:
      - .env
    environment:
      - TYPE=keyword
      - CLIENT_ID=49590 # PINDAHAN DB -- pastikan cocok dengan client_id akun di MongoDB
      - LIMIT=300
      - SOURCE=linkedin
      - ID_TARGET=1
      - VM=VM-CRAWLING-ANTAM
      - PORT=1567
      - CHROME_PROFILE_ROOT=/app/chrome_profiles
      - RESTART_DRIVER_EVERY_N_KEYWORDS=7
    volumes:
      - /home/promtail/:/logs
      - /data/chrome_profiles/client_49590:/app/chrome_profiles/client_49590
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1567/status"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
