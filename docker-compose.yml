services:
  linkedin-search:
    image: "linkedin-search"
    build: .
    container_name: linkedin-search
    restart: on-failure:5
    init: true
    shm_size: "64mb"      # Chromium headless tidak butuh lebih dari 64MB (turun dari 700mb)
    mem_limit: 850m       # budget 4×850MB = 3.4GB, aman di 4GB RAM
    cpus: 0.5             # 4×0.5 = 2.0 cpu, sesuai 2 core server
    ports:
      - "1567:1567"
    env_file:
      - .env
    environment:
      - TYPE=keyword
      - CLIENT_ID=49716 # PINDAHAN DB -- pastikan cocok dengan client_id akun di MongoDB
      - LIMIT=300
      - SOURCE=linkedin
      - ID_TARGET=1
      - VM=VM-CRAWLING-ANTAM
      - PORT=1567
      - CHROME_PROFILE_ROOT=/app/chrome_profiles
      - RESTART_DRIVER_EVERY_N_KEYWORDS=15
    volumes:
      - /home/promtail/:/logs
      - /data/chrome_profiles/client_49716:/app/chrome_profiles/client_49716
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1567/status"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
